{% extends 'base.html' %}

{% block title %}Cancel Booking | JustRelax{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl space-y-6">
        <h1 class="text-2xl font-black text-slate-900">Cancel Booking #{{ booking.booking_reference }}</h1>
        <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 text-xs space-y-2">
            <div class="flex justify-between"><span>Paid Fare</span><span class="font-bold">₹{{ booking.total_amount|floatformat:2 }}</span></div>
            <div class="flex justify-between text-red-600"><span>Cancellation Fee (15%)</span><span>15%</span></div>
            <div class="flex justify-between font-bold text-emerald-700 pt-2 border-t"><span>Refund to Wallet</span><span>85% Automatic Refund</span></div>
        </div>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Reason</label>
                <select name="cancellation_reason" class="w-full text-xs font-bold p-3 bg-slate-50 rounded-xl border border-slate-200">
                    <option>Change of plans</option>
                    <option>Other reasons</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold text-xs py-3.5 rounded-xl shadow-md">
                Confirm Cancellation
            </button>
        </form>
    </div>
</div>
{% endblock %}
