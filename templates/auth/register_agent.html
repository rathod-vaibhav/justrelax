{% extends 'base.html' %}

{% block title %}B2B Agent Registration | JustRelax{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white rounded-3xl p-8 border border-slate-100 shadow-xl space-y-6">
        <div class="text-center space-y-1">
            <span class="bg-amber-50 text-amber-800 text-[11px] font-bold px-3 py-1 rounded-full">B2B Agent Registration</span>
            <h1 class="text-2xl font-black text-slate-900 mt-2">Join JustRelax Agent Network</h1>
            <p class="text-xs text-slate-500">Access wholesale net fares & set your own client markups.</p>
        </div>
        <form method="POST" class="space-y-3 text-xs">
            {% csrf_token %}
            <div>
                <label class="block font-bold text-slate-700 mb-1">Agency Name</label>
                <input type="text" name="agency_name" required class="w-full font-bold p-2.5 bg-slate-50 rounded-xl border border-slate-200">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">PAN / Tax ID</label>
                    <input type="text" name="tax_or_pan" required class="w-full font-bold p-2.5 bg-slate-50 rounded-xl border border-slate-200">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">City</label>
                    <input type="text" name="city" required class="w-full font-bold p-2.5 bg-slate-50 rounded-xl border border-slate-200">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">First Name</label>
                    <input type="text" name="first_name" required class="w-full font-bold p-2.5 bg-slate-50 rounded-xl border border-slate-200">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Last Name</label>
                    <input type="text" name="last_name" required class="w-full font-bold p-2.5 bg-slate-50 rounded-xl border border-slate-200">
                </div>
            </div>
            <div>
                <label class="block font-bold text-slate-700 mb-1">Username</label>
                <input type="text" name="username" required class="w-full font-bold p-2.5 bg-slate-50 rounded-xl border border-slate-200">
            </div>
            <div>
                <label class="block font-bold text-slate-700 mb-1">Email</label>
                <input type="email" name="email" required class="w-full font-bold p-2.5 bg-slate-50 rounded-xl border border-slate-200">
            </div>
            <div>
                <label class="block font-bold text-slate-700 mb-1">Phone</label>
                <input type="tel" name="phone_number" required class="w-full font-bold p-2.5 bg-slate-50 rounded-xl border border-slate-200">
            </div>
            <div>
                <label class="block font-bold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required class="w-full font-bold p-2.5 bg-slate-50 rounded-xl border border-slate-200">
            </div>
            <button type="submit" class="w-full orange-gradient text-white font-bold text-xs py-3.5 rounded-xl shadow-md mt-2">
                SUBMIT AGENT REGISTRATION
            </button>
        </form>
    </div>
</div>
{% endblock %}
